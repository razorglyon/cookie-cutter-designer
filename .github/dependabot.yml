version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      svelte-vite-compatible:
        patterns:
          - "svelte"
          - "svelte-check"
          - "@sveltejs/*"
          - "vite"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Major upgrades are validated manually on dedicated branches.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    reviewers:
      - "razorglyon"
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions-compatible:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Major action upgrades require changelog and runner compatibility review.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    reviewers:
      - "razorglyon"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
